[package]
name = "aura-editor"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "AURA host Editor adapter (Slint on aura-baseview) for CLAP/VST3/LV2 GUI"
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
aura-baseview = { workspace = true, default-features = false }
aura-core = { workspace = true }
aura-params = { workspace = true }
baseview = { workspace = true }
slint = { workspace = true }
raw-window-handle = { workspace = true }
log = "0.4"
paste = "1"

# Linux cross-build from Windows: avoid linking host fontconfig.
# fontique uses dlopen at runtime; RUST_FONTCONFIG_DLOPEN=on is set in
# .cargo/config.toml [env] so yeslogic-fontconfig-sys skips pkg-config.
[target.'cfg(target_os = "linux")'.dependencies]
i-slint-common = { version = "=1.17.1", features = ["fontconfig-dlopen"] }

[features]
default = ["backend-femtovg"]
# Pass renderer choice through to the window stack.
backend-femtovg = ["aura-baseview/backend-femtovg"]
backend-skia = ["aura-baseview/backend-skia"]
backend-wgpu = ["aura-baseview/backend-wgpu"]
backend-wgpu-vulkan = ["aura-baseview/backend-wgpu-vulkan"]

[lints]
workspace = true
