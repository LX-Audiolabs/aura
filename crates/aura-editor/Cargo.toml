[package]
name = "lx-aura-editor"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "AURA host Editor adapter (Slint on aura-baseview) for CLAP/VST3/LV2"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/lx-aura-editor"
keywords = ["slint", "audio", "plugin", "gui", "clap"]
categories = ["multimedia::audio", "gui"]
publish = true

[lib]
name = "aura_editor"

[dependencies]
lx-aura-baseview = { workspace = true, default-features = false }
lx-aura-core = { workspace = true }
lx-aura-params = { workspace = true }
baseview = { workspace = true }
slint = { workspace = true }
raw-window-handle = { workspace = true }
log = "0.4"
paste = "1"

[target.'cfg(target_os = "linux")'.dependencies]
i-slint-common = { version = "=1.17.1", features = ["fontconfig-dlopen"] }

[features]
default = ["backend-femtovg"]
backend-femtovg = ["lx-aura-baseview/backend-femtovg"]
backend-skia = ["lx-aura-baseview/backend-skia"]
backend-wgpu = ["lx-aura-baseview/backend-wgpu"]
backend-wgpu-vulkan = ["lx-aura-baseview/backend-wgpu-vulkan"]

[package.metadata.docs.rs]
features = ["backend-femtovg"]

[lints]
workspace = true
