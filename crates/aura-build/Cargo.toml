[package]
name = "lx-aura-build"
version.workspace = true
edition.workspace = true
# Fonts: OFL — see fonts/OFL.txt (not re-licensed by this SPDX).
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "AURA build helper — @aura Slint widgets + bundled fonts for slint-build"
readme = "README.md"
documentation = "https://docs.rs/lx-aura-build"
keywords = ["slint", "audio", "plugin", "ui", "build"]
categories = ["multimedia::audio", "development-tools::build-utils"]
publish = true
include = [
    "src/**",
    "ui/**",
    "fonts/**",
    "README.md",
]

[lib]
name = "aura_build"

[dependencies]
slint-build = { workspace = true }

[dev-dependencies]
slint-interpreter = { workspace = true }
spin_on = "0.1"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
