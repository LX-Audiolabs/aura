[package]
name = "lx-aura-baseview"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "AURA Slint + baseview window stack (FemtoVG / Skia / software)"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/lx-aura-baseview"
keywords = ["slint", "baseview", "audio", "plugin", "gui"]
categories = ["multimedia::audio", "gui"]
publish = false

[lib]
name = "aura_baseview"

[dependencies]
baseview = { workspace = true }
slint = { workspace = true }
raw-window-handle = { workspace = true }

keyboard-types = { version = "0.8.3", default-features = false }
copypasta = "0.10"

i-slint-renderer-skia = { version = "=1.17.1", optional = true }
wgpu = { workspace = true, optional = true }
pollster = { version = "1.0", optional = true }

[features]
default = ["backend-femtovg"]
backend-femtovg = ["slint/renderer-femtovg", "baseview/opengl"]
backend-skia = ["slint/renderer-skia", "dep:i-slint-renderer-skia"]
backend-wgpu = ["slint/renderer-software", "dep:wgpu", "dep:pollster"]
backend-wgpu-vulkan = ["backend-wgpu"]

[package.metadata.docs.rs]
features = ["backend-femtovg"]

[lints]
workspace = true
