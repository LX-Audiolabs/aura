[package]
name = "aura"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AURA — Audio Unified Rust Architecture (umbrella crate)"
readme.workspace = true
publish = false

[dependencies]
aura-core = { workspace = true }
aura-params = { workspace = true }
aura-derive = { workspace = true }
aura-dsp = { workspace = true }
aura-midi = { workspace = true }
aura-clap = { workspace = true, optional = true }
aura-vst3 = { workspace = true, optional = true }
aura-lv2 = { workspace = true, optional = true }

[features]
default = []
clap = ["dep:aura-clap"]
vst3 = ["dep:aura-vst3"]
lv2 = ["dep:aura-lv2"]

[lints]
workspace = true
