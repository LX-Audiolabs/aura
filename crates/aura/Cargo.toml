[package]
name = "aura"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "AURA — Audio Unified Rust Architecture (umbrella for plugin authors)"
readme.workspace = true
documentation = "https://docs.rs/aura"
keywords = ["audio", "plugin", "clap", "vst3", "slint"]
categories = ["multimedia::audio"]
publish = false

[dependencies]
aura-core = { workspace = true }
aura-params = { workspace = true }
aura-derive = { workspace = true }
aura-midi = { workspace = true }
aura-dsp = { workspace = true, optional = true }
aura-clap = { workspace = true, optional = true }
aura-vst3 = { workspace = true, optional = true }
aura-lv2 = { workspace = true, optional = true }

[features]
default = ["dsp"]
dsp = ["dep:aura-dsp"]
clap = ["dep:aura-clap"]
vst3 = ["dep:aura-vst3"]
lv2 = ["dep:aura-lv2"]

[package.metadata.docs.rs]
features = ["clap", "vst3", "lv2", "dsp"]

[lints]
workspace = true
