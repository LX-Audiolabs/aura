[package]
name = "aura-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Proc macros for AURA: #[derive(Params)] and #[derive(ParamEnum)]"
readme = "README.md"
documentation = "https://docs.rs/aura-derive"
keywords = ["audio", "plugin", "proc-macro", "derive"]
categories = ["multimedia::audio"]
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
