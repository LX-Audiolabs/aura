[package]
name = "lx-aura-lv2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "LV2 format wrapper for AURA (Linux; reduced PluginLogic subset)"
readme = "README.md"
documentation = "https://docs.rs/lx-aura-lv2"
keywords = ["lv2", "audio", "plugin", "linux"]
categories = ["multimedia::audio"]
publish = true

[lib]
name = "aura_lv2"

[dependencies]
lx-aura-core = { workspace = true }
lx-aura-params = { workspace = true }
lv2-sys = "2.0"

# No [dev-dependencies] on lx-aura: publish cycle with optional lv2 on the
# umbrella. UI unit tests hand-roll a tiny Params impl instead of derive.

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
