[package]
name = "lx-aura-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "AURA DSP — synthesis, effects, analysis, maths"
readme = "README.md"
documentation = "https://docs.rs/lx-aura-dsp"
publish = true
keywords = ["dsp", "synthesis", "audio", "filter", "effects"]
categories = ["multimedia::audio"]

# Provenance: see repo NOTICE (naad / fundsp / InfiniteDSP).

[lib]
name = "aura_dsp"

[dependencies]
lx-aura-params = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde", "const_generics"] }
thiserror = "2"
tracing = "0.1"
# LUFS / true-peak (`fx::AutoLoudMeter`, `fx::MasteringMeter`) — from lx-dsp
ebur128 = "0.1"
# Analysis (`analysis::SnapFFT`, spectrum bins) — from lx-analysis
realfft = "3"
atomic_float = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
goonj = { version = "1", features = ["binaural"], optional = true }
hisab = { version = "1.4", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[features]
default = ["synthesis"]
synthesis = ["dep:hisab"]
logging = ["dep:tracing-subscriber"]
# Alias for product plugins that used lx-analysis `dev-logging`
dev-logging = ["logging"]
acoustics = ["dep:goonj", "dep:hisab"]
full = ["synthesis", "acoustics", "logging"]

[package.metadata.docs.rs]
features = ["full"]

[[bench]]
name = "benchmarks"
harness = false

[lints]
workspace = true
