name: Framework CI

# Ship matrix (CI installs only these per OS):
#   CLAP  — Linux, Windows, macOS
#   VST3  — Windows, macOS
#   LV2   — Linux
#
# (rust-lv2/lv2-sys has no macOS support; VST3 is not a Linux ship target.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  examples:
    name: Examples (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            formats: --clap --lv2
          - os: windows-latest
            name: windows
            formats: --clap --vst3
          - os: macos-latest
            name: macos
            formats: --clap --vst3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Install cargo-aura
        run: cargo install --path tools/cargo-aura --locked

      - name: cargo aura doctor
        env:
          AURA_PATH: ${{ github.workspace }}
        run: cargo aura doctor

      - name: Build & install smoke-gain (${{ matrix.formats }})
        shell: bash
        env:
          AURA_PATH: ${{ github.workspace }}
          CLAPINS: ${{ runner.temp }}/aura-ci/clap
          VST3INS: ${{ runner.temp }}/aura-ci/vst3
          LV2INS: ${{ runner.temp }}/aura-ci/lv2
        run: |
          cargo aura install ${{ matrix.formats }} --release -plug smoke-gain

      # clap-val-action injects Windows paths with backslashes into an unquoted
      # bash line, so \a / \t get eaten (D:\a\_temp → D:a_temp). Download and
      # validate ourselves using $RUNNER_TEMP (env expansion is not re-parsed).
      - name: Download clap-validator
        shell: bash
        run: |
          set -euo pipefail
          VER=0.3.2
          case "${{ runner.os }}" in
            Linux)
              curl -fsSL "https://github.com/free-audio/clap-validator/releases/download/${VER}/clap-validator-${VER}-ubuntu-18.04.tar.gz" -o cv.tgz
              tar xzf cv.tgz
              ;;
            macOS)
              curl -fsSL "https://github.com/free-audio/clap-validator/releases/download/${VER}/clap-validator-${VER}-macos-universal.tar.gz" -o cv.tgz
              tar xzf cv.tgz
              mv binaries/clap-validator ./clap-validator
              ;;
            Windows)
              curl -fsSL "https://github.com/free-audio/clap-validator/releases/download/${VER}/clap-validator-${VER}-windows.zip" -o cv.zip
              unzip -o cv.zip
              ;;
          esac
          ./clap-validator --version

      - name: Validate CLAP plugin
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN="${RUNNER_TEMP}/aura-ci/clap/smoke-gain.clap"
          ./clap-validator validate "$PLUGIN"

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: smoke-gain-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/aura-ci/clap/smoke-gain.clap
            ${{ runner.temp }}/aura-ci/vst3/smoke-gain.vst3
            ${{ runner.temp }}/aura-ci/lv2/smoke-gain.lv2
          if-no-files-found: warn
