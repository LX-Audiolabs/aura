name: semver

# Expensive rustdoc builds: run manually before a release, not on every PR.
on:
  workflow_dispatch:

jobs:
  semver:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout selected commit
        env:
          CI_TOKEN: ${{ forgejo.token }}
          CI_REF: ${{ forgejo.ref }}
          CI_SHA: ${{ forgejo.sha }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "http://192.168.129.29:3000/${{ forgejo.repository }}.git"
          auth=$(printf 'oauth2:%s' "$CI_TOKEN" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic $auth" fetch --depth 1 origin "$CI_REF"
          git checkout --force "$CI_SHA"
          test "$(git rev-parse HEAD)" = "$CI_SHA"
      - name: Ensure cargo-semver-checks
        run: |
          set -euo pipefail
          if test "$(cargo semver-checks --version 2>/dev/null || true)" != "cargo-semver-checks 0.51.0"; then
            cargo install cargo-semver-checks --version 0.51.0 --locked
          fi
          cargo semver-checks --version
          rustc --version
      - name: Check published APIs
        run: |
          set -euo pipefail
          # Uses the latest eligible crates.io baseline for each publishable crate.
          # Renderer backends are mutually exclusive; do not enable all features.
          cargo semver-checks --workspace --default-features
