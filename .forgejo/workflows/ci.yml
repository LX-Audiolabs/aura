name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: self-hosted
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        run: git clone --depth 1 "http://oauth2:${{ secrets.FORGEJO_TOKEN }}@192.168.129.29:3000/${{ github.repository }}.git" .
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
