[workspace]
resolver = "3"
members = [
    "crates/aura",
    "crates/aura-params",
    "crates/aura-derive",
    "crates/aura-core",
    "crates/aura-clap",
    "crates/aura-vst3",
    "crates/aura-lv2",
    "crates/aura-baseview",
    "crates/aura-editor",
    "crates/aura-dsp",
    "crates/aura-midi",
    "crates/aura-build",
    "crates/aura-test",
    "tools/cargo-aura",
    "tools/aura-preview",
    "tools/aura-gui",
    "examples/smoke-gain",
    # Window-stack demos (aura-baseview)
    "crates/aura-baseview/examples/render_femtovg",
    "crates/aura-baseview/examples/open_parented",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"
description = "AURA — Audio Unified Rust Architecture (Slint + CLAP/VST3/LV2)"
repository = "https://github.com/LX-Audiolabs/aura"
authors = ["LX Audiolabs"]
readme = "README.md"

[workspace.dependencies]
# --- AURA crates ---
aura = { path = "crates/aura" }
aura-params = { path = "crates/aura-params" }
aura-derive = { path = "crates/aura-derive" }
aura-core = { path = "crates/aura-core" }
aura-clap = { path = "crates/aura-clap" }
aura-vst3 = { path = "crates/aura-vst3" }
aura-lv2 = { path = "crates/aura-lv2" }
aura-baseview = { path = "crates/aura-baseview", default-features = false }
aura-editor = { path = "crates/aura-editor", default-features = false }
aura-dsp = { path = "crates/aura-dsp" }
aura-midi = { path = "crates/aura-midi" }
aura-build = { path = "crates/aura-build" }
aura-test = { path = "crates/aura-test" }

# --- Slint + windowing (pinned with aura-baseview) ---
baseview = "0.3"
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "raw-window-handle-06",
    "compat-1-2",
] }
slint-build = { version = "=1.17.1" }
# Interpreter is tooling-only (aura-preview). `internal` unlocks
# create_with_existing_window for hot-reload; safe because of the exact pin.
slint-interpreter = { version = "=1.17.1", features = [
    "display-diagnostics",
    "image-default-formats",
    "internal",
] }
raw-window-handle = "0.6"
wgpu = { version = "30", default-features = false, features = ["wgsl"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Host-boundary catch_unwind (format wrappers) needs unwind. Default is
# already unwind; pin so a future abort default cannot reintroduce host aborts.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

[profile.shell]
inherits = "release"
