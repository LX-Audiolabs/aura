[workspace]
resolver = "3"
members = [
    "crates/aura",
    "crates/aura-params",
    "crates/aura-derive",
    "crates/aura-core",
    "crates/aura-clap",
    "crates/aura-vst3",
    "crates/aura-lv2",
    "crates/aura-baseview",
    "crates/aura-editor",
    "crates/aura-dsp",
    "crates/aura-midi",
    "crates/aura-build",
    "crates/aura-test",
    "crates/aura-hot",
    "crates/aura-host",
    "tools/cargo-aura",
    "tools/aura-preview",
    "examples/smoke-gain",
    "examples/smoke-midi-fx",
    "examples/smoke-sidechain",
    "examples/smoke-aux",
    "examples/smoke-synth",
    # Window-stack demos (aura-baseview)
    "crates/aura-baseview/examples/render_femtovg",
    "crates/aura-baseview/examples/open_parented",
]

[workspace.package]
version = "0.14.4"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"
description = "AURA — Audio Unified Rust Architecture (Slint + CLAP/VST3/LV2)"
repository = "https://github.com/LX-Audiolabs/aura"
homepage = "https://github.com/LX-Audiolabs/aura"
authors = ["LX Audiolabs"]
readme = "README.md"

[workspace.dependencies]
# --- AURA crates (version required for future `cargo package` / publish) ---
lx-aura = { path = "crates/aura", version = "0.14.4" }
lx-aura-params = { path = "crates/aura-params", version = "0.14.4" }
lx-aura-derive = { path = "crates/aura-derive", version = "0.14.4" }
lx-aura-core = { path = "crates/aura-core", version = "0.14.4" }
lx-aura-clap = { path = "crates/aura-clap", version = "0.14.4" }
lx-aura-vst3 = { path = "crates/aura-vst3", version = "0.14.4" }
lx-aura-lv2 = { path = "crates/aura-lv2", version = "0.14.4" }
lx-aura-baseview = { path = "crates/aura-baseview", version = "0.14.4", default-features = false }
lx-aura-editor = { path = "crates/aura-editor", version = "0.14.4", default-features = false }
lx-aura-dsp = { path = "crates/aura-dsp", version = "0.14.4" }
lx-aura-midi = { path = "crates/aura-midi", version = "0.14.4" }
lx-aura-build = { path = "crates/aura-build", version = "0.14.4" }
lx-aura-test = { path = "crates/aura-test", version = "0.14.4" }

# --- Slint + windowing (pinned with aura-baseview) ---
# Stay on 0.3.x for now. 0.4.x is a breaking draw/poll redesign (own PR).
# 0.3.7: Win32 VST3 first-load DPI hang fix + parent-resize timing.
baseview = "=0.3.7"
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "raw-window-handle-06",
    "compat-1-2",
] }
slint-build = { version = "=1.18.1" }
# Interpreter is tooling-only (aura-preview). `internal` unlocks
# create_with_existing_window for hot-reload; safe because of the exact pin.
slint-interpreter = { version = "=1.18.1", features = [
    "display-diagnostics",
    "image-default-formats",
    "internal",
] }
raw-window-handle = "0.6"
wgpu = { version = "30", default-features = false, features = ["wgsl"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Host-boundary catch_unwind (format wrappers) needs unwind. Default is
# already unwind; pin so a future abort default cannot reintroduce host aborts.
[profile.dev]
panic = "unwind"
# Incremental caches ate ~90 GB in lx-audiolabs-dev/debug/incremental.
# Full rebuilds are cheap enough here; don't regrow that.
incremental = false

[profile.release]
panic = "unwind"

[profile.shell]
inherits = "release"
