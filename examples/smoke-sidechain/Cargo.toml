[package]
name = "smoke-sidechain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "AURA in-tree CLAP smoke — stereo FX with mono sidechain"

[lib]
crate-type = ["cdylib", "lib"]

