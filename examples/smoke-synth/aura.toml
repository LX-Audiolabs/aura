[vendor]
name = "LX Audiolabs"
id = "lx"
url = "https://lx-audiolabs.com"

[[plugin]]
name = "AURA Smoke Synth"
bundle_id = "smoke-synth"
crate = "smoke-synth"
category = "instrument"

# `cargo aura install --clap|--vst3` base dir (appends CLAP / VST3).
# No admin needed; point at system Common Files if you prefer.
# Per-format: clap = "C:\\Program Files\\Common Files\\CLAP"
# Env CLAPINS / VST3INS override when set.
[install]
dir = "%LOCALAPPDATA%\\Programs\\Common"
