# AURA — agal config (agent orientation for the framework workspace).
# Product plugin catalogs are separate repos (may be private); they own their own agal.toml.

# Default output is `agal/` (omit this key). Kept explicit for clarity.
output_dir = "agal"

# Framework UI stack (product design-system crates stay in product repos).
ui_crates = ["aura-build", "aura-editor", "aura-baseview"]

[rules]
scope = "AURA is Slint + baseview only; formats CLAP / VST3 / LV2 — no egui/iced/Vizia, no AU/AAX/VST2."
basis_first = "Keep framework basis shippable; product catalogs consume AURA via path/git deps."
thin_formats = "One PluginLogic API; format wrappers stay thin — no format-shaped core."
product_infra_out = "Product shm / vault / *Shared UI stay in product repos. Portable DSP algos live in aura-dsp (JUCE-shaped with aura-midi)."
roadmap = "Public status: README + CHANGELOG. Internal planning docs are gitignored (local only)."
nice_plug = "External multi-UI frameworks: recommend nice-plug (or truce/clack), not NIH-plug."
agal_optional = "agal is optional mesh for authors; never hard-depend for cargo aura build."

# Framework smoke is intentionally small — not a product plugin surface.
[[suppress]]
code = "large_param_surface"
node = "smoke-gain"
reason = "In-tree CLAP smoke example; not a product plugin."

# Nested baseview demos are path-included packages, not dead crates.
# (agal ≥0.6.2 also skips `/examples/` for crate_no_dependents; keep belt+suspenders.)
[[suppress]]
code = "crate_no_dependents"
node = "aura-example-open-parented"
reason = "baseview example binary; not a library dep."

[[suppress]]
code = "crate_no_dependents"
node = "aura-example-render-femtovg"
reason = "baseview example binary; not a library dep."
